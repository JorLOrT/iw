# 1. Configuración para que funcione localhost:8090/alumnos, etc.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /webapps/iw/lab02>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

# 2. Virtual Host: Profesores (profesores.com)
<VirtualHost *:80>
    ServerName profesores.com
    ServerAlias profes.com docentes.com educadores.com
    DocumentRoot /webapps/iw/lab02/profesores
</VirtualHost>

# 3. Virtual Host: Alumnos (alumnos.com)
<VirtualHost *:80>
    ServerName alumnos.com
    ServerAlias estudiantes.com alumnos.local discipulos.com
    DocumentRoot /webapps/iw/lab02/alumnos
</VirtualHost>

# 4. Virtual Host: Administrativos (administrativos.com)
<VirtualHost *:80>
    ServerName administrativos.com
    ServerAlias admin.com administrativo.local secretaria.com
    DocumentRoot /webapps/iw/lab02/administrativos
</VirtualHost>
